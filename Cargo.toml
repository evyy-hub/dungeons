[package]
name = "dungeons"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = [
    "dynamic_linking",
    "serialize",
    "jpeg",
] }
bevy_gltf = "0.19.1"
avian3d = { version = "0.7.0", features = ["3d"] }
bevy_mod_outline = { version = "0.13" }
rand = "0.10.3"
serde = "1.0.228"
serde_json = "1.0.149"
toml = "1.1.6+spec-1.1.0"
ron = "0.12.2"
anyhow = "1.0.104"
bevy-tnua-avian3d = "0.12.1"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[package]
name = "dungeons"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking", "serialize"] }
bevy_gltf = "0.19.0"
avian3d = { version = "0.7.0", features = ["3d"] }
bevy_mod_outline = { git = "https://github.com/komadori/bevy_mod_outline" }
rand = "0.9"
serde = "1.0.228"
serde_json = "1.0.149"
toml = "0.9.8"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
